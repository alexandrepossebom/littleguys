  <path d="M 629.074 100.000 c 103.234 0 154.851 0 194.281 20.091 a 184.329 184.329 0 0 1 80.555 80.555 c 20.091 39.430 20.091 91.047 20.091 194.281 L 924.000 629.074 c 0 103.234 0 154.851 -20.091 194.281 a 184.329 184.329 0 0 1 -80.555 80.555 c -39.430 20.091 -91.047 20.091 -194.281 20.091 L 394.926 924.000 c -103.234 0 -154.851 0 -194.281 -20.091 a 184.329 184.329 0 0 1 -80.555 -80.555 c -20.091 -39.430 -20.091 -91.047 -20.091 -194.281 L 100.000 394.926 c 0 -103.234 0 -154.851 20.091 -194.281 a 184.329 184.329 0 0 1 80.555 -80.555 c 39.430 -20.091 91.047 -20.091 194.281 -20.091 Z" fill="url(#bg)" filter="url(#plateShadow)"/>
